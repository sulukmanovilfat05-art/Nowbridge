                  0xFF00B894.toInt(), 0xFFFD9644.toInt(), 0xFF0984E3.toInt()
              )
              private val brand = mapOf(
                  "com.whatsapp" to 0xFF25D366.toInt(),
                  "com.whatsapp.w4b" to 0xFF25D366.toInt(),
                  "org.telegram.messenger" to 0xFF2AABEE
