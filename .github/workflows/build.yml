name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Create project and build
        run: |
          mkdir -p work && cd work
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > gradle.properties
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.nowbridge"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.locnall.KimGiSa"
                  minSdk = 31; targetSdk = 36
                  versionCode = 1; versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.1")
              implementation(platform("androidx.compose:compose-bom:2025.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.POST_PROMOTED_NOTIFICATIONS" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:icon="@drawable/ic_bridge"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BridgeListener"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <receiver android:name=".DismissReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/nowbridge
          cat > app/src/main/java/com/example/nowbridge/BridgeListener.kt <<'EOF'
          package com.example.nowbridge

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class BridgeListener : NotificationListenerService() {

              override fun onListenerConnected() { LiveNotifier.ensureChannel(this) }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return
                  if (sbn.packageName !in Prefs.selected(this)) return
                  val n = sbn.notification
                  val remove = Prefs.removeOriginal(this)

                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) {
                      if (remove) cancelNotification(sbn.key)
                      return
                  }
                  if (sbn.isOngoing) return
                  if (n.category == Notification.CATEGORY_CALL || n.category == Notification.CATEGORY_TRANSPORT) return

                  LiveNotifier.show(this, sbn)
                  if (remove) cancelNotification(sbn.key)
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) LiveNotifier.clear(sbn.id)
              }
          }
          EOF
          cat > app/src/main/java/com/example/nowbridge/LiveNotifier.kt <<'EOF'
          package com.example.nowbridge

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.os.Bundle
          import android.service.notification.StatusBarNotification
          import androidx.core.graphics.drawable.toBitmap

          object LiveNotifier {
              private const val CH = "now_bridge_live"
              private val history = HashMap<Int, MutableList<String>>()
              private val counts = HashMap<Int, Int>()

              private val palette = intArrayOf(
                  0xFF6C5CE7.toInt(), 0xFF00B4D8.toInt(), 0xFFE84393.toInt(),
                  0xFF00B894.toInt(), 0xFFFD9644.toInt(), 0xFF0984E3.toInt()
              )
              private val brand = mapOf(
                  "com.whatsapp" to 0xFF25D366.toInt(),
                  "com.whatsapp.w4b" to 0xFF25D366.toInt(),
                  "org.telegram.messenger" to 0xFF2AABEE.toInt(),
                  "org.telegram.messenger.web" to 0xFF2AABEE.toInt(),
                  "com.zhiliaoapp.musically" to 0xFFFE2C55.toInt(),
                  "com.ss.android.ugc.trill" to 0xFFFE2C55.toInt(),
                  "com.instagram.android" to 0xFFE1306C.toInt(),
                  "com.discord" to 0xFF5865F2.toInt(),
                  "com.viber.voip" to 0xFF7360F2.toInt(),
                  "com.vkontakte.android" to 0xFF0077FF.toInt(),
                  "com.facebook.orca" to 0xFF0084FF.toInt(),
                  "com.snapchat.android" to 0xFFF2B600.toInt()
              )

              fun ensureChannel(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CH, "Now Bar", NotificationManager.IMPORTANCE_DEFAULT)
                  )
              }

              fun clear(id: Int) { history.remove(id); counts.remove(id) }

              private fun circle(src: Bitmap): Bitmap {
                  val s = minOf(src.width, src.height)
                  val out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(out)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  c.drawCircle(s / 2f, s / 2f, s / 2f, p)
                  p.xfermode = PorterDuffXfermode(PorterDuff.Mode.SRC_IN)
                  c.drawBitmap(src, (s - src.width) / 2f, (s - src.height) / 2f, p)
                  return out
              }

              private fun letter(ch: String, color: Int): Bitmap {
                  val s = 256
                  val out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(out)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.color = color
                  c.drawCircle(s / 2f, s / 2f, s / 2f, p)
                  p.color = Color.WHITE
                  p.textSize = 130f
                  p.textAlign = Paint.Align.CENTER
                  p.typeface = Typeface.DEFAULT_BOLD
                  c.drawText(ch, s / 2f, s / 2f - (p.descent() + p.ascent()) / 2f, p)
                  return out
              }

              private fun styled(ctx: Context, a: Notification.Action): Notification.Action? {
                  val reply = (a.remoteInputs?.isNotEmpty() == true) ||
                      a.semanticAction == Notification.Action.SEMANTIC_ACTION_REPLY
                  val read = a.semanticAction == Notification.Action.SEMANTIC_ACTION_MARK_AS_READ
                  if (!reply && !read) return null
                  val pi = a.actionIntent ?: return null
                  val icon = if (reply) R.drawable.ic_reply else R.drawable.ic_check
                  val label = if (reply) "Ответить" else "Прочитано"
                  val nb = Notification.Action.Builder(Icon.createWithResource(ctx, icon), label, pi)
                  a.remoteInputs?.forEach { nb.addRemoteInput(it) }
                  nb.setSemanticAction(a.semanticAction)
                  nb.setAllowGeneratedReplies(a.allowGeneratedReplies)
                  return nb.build()
              }

              fun show(ctx: Context, sbn: StatusBarNotification) {
                  val n = sbn.notification
                  val e = n.extras
                  val pm = ctx.packageManager
                  val app = runCatching { pm.getApplicationLabel(pm.getApplicationInfo(sbn.packageName, 0)).toString() }
                      .getOrDefault(sbn.packageName)

                  val title = (e.getCharSequence(Notification.EXTRA_CONVERSATION_TITLE)
                      ?: e.getCharSequence(Notification.EXTRA_TITLE) ?: app).toString()
                  val text = (e.getCharSequence(Notification.EXTRA_BIG_TEXT)
                      ?: e.getCharSequence(Notification.EXTRA_TEXT) ?: return).toString()

                  val id = "${sbn.packageName}|$title".hashCode()
                  val lines = history.getOrPut(id) { mutableListOf() }
                  if (lines.lastOrNull() != text) lines.add(text)
                  while (lines.size > 5) lines.removeAt(0)
                  val count = (counts[id] ?: 0) + 1
                  counts[id] = count

                  val color = brand[sbn.packageName] ?: palette[Math.floorMod(title.hashCode(), palette.size)]
                  val chip = if (count > 1) "${title.take(5)}·$count" else title.take(7)
                  val sub = if (count > 1) "$app · $count новых" else app

                  val appBmp = runCatching { circle(pm.getApplicationIcon(sbn.packageName).toBitmap(256, 256)) }.getOrNull()
                      ?: letter(app.take(1).uppercase().ifEmpty { "?" }, color)
                  val smallIcon = Icon.createWithBitmap(appBmp)

                  val b = Notification.Builder(ctx, CH)
                      .setSmallIcon(smallIcon)
                      .setLargeIcon(appBmp)
                      .setColor(color)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setSubText(sub)
                      .setStyle(Notification.BigTextStyle().bigText(lines.joinToString("\n")))
                      .setOngoing(true)
                      .setAutoCancel(true)
                      .setOnlyAlertOnce(false)
                      .setWhen(System.currentTimeMillis())
                      .setShowWhen(true)

                  val tap = n.contentIntent ?: pm.getLaunchIntentForPackage(sbn.packageName)?.let {
                      PendingIntent.getActivity(ctx, id, it, PendingIntent.FLAG_IMMUTABLE)
                  }
                  tap?.let { b.setContentIntent(it) }

                  n.actions?.mapNotNull { styled(ctx, it) }
                      ?.sortedBy { if (it.title.toString() == "Ответить") 0 else 1 }
                      ?.take(2)?.forEach { b.addAction(it) }

                  val dismiss = PendingIntent.getBroadcast(
                      ctx, id,
                      Intent(ctx, DismissReceiver::class.java).putExtra("id", id),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  b.addAction(
                      Notification.Action.Builder(Icon.createWithResource(ctx, R.drawable.ic_close), "Закрыть", dismiss).build()
                  )

                  b.addExtras(Bundle().apply {
                      putBoolean("android.requestPromotedOngoing", true)
                      putString("android.shortCriticalText", chip)
                      putInt("android.ongoingActivityNoti.style", 1)
                      putString("android.ongoingActivityNoti.primaryInfo", title)
                      putString("android.ongoingActivityNoti.secondaryInfo", text)
                      putString("android.ongoingActivityNoti.chipExpandedText", chip)
                      putInt("android.ongoingActivityNoti.chipBgColor", color)
                      putParcelable("android.ongoingActivityNoti.chipIcon", Icon.createWithBitmap(appBmp))
                      putParcelable("android.ongoingActivityNoti.secondaryInfoIcon", Icon.createWithBitmap(appBmp))
                      putString("android.ongoingActivityNoti.nowbarPrimaryInfo", title)
                      putString("android.ongoingActivityNoti.nowbarSecondaryInfo", text)
                  })
                  ctx.getSystemService(NotificationManager::class.java).notify(id, b.build())
              }
          }

          class DismissReceiver : android.content.BroadcastReceiver() {
              override fun onReceive(ctx: Context, i: Intent) {
                  val id = i.getIntExtra("id", 0)
                  ctx.getSystemService(NotificationManager::class.java).cancel(id)
